<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Навчальна форма реєстрації з перевіркою полів через JavaScript. Без створення облікового запису.">
  <title>Реєстрація — навчальна форма</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container d-flex align-items-center justify-content-between gap-3">
      <a class="brand" href="./">Form<span>Check</span><span class="brand-dot">.</span></a>
      <span class="topbar-label">НАВЧАЛЬНИЙ JAVASCRIPT ПРОЄКТ</span>
    </div>
  </header>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-7 col-xl-6">
        <div class="mb-4">
          <span class="eyebrow">ПРАКТИКА JAVASCRIPT</span>
          <h1 class="display-6 fw-bold mt-2">Створення облікового запису<span class="brand-dot">.</span></h1>
          <p class="text-secondary">Навчальна форма для перевірки введених даних. Справжній обліковий запис не створюється.</p>
        </div>
        <section class="form-card" aria-labelledby="form-title">
          <h2 id="form-title" class="h5 fw-bold mb-4">Реєстрація</h2>
          <form id="registration-form" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="username">Ім'я користувача</label>
              <input class="form-control form-control-lg" id="username" name="username" type="text" minlength="3" maxlength="60" autocomplete="username" placeholder="Мінімум 3 символи" aria-describedby="username-error" required>
              <div id="username-error" class="invalid-feedback" role="alert"></div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="email">Email</label>
              <input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="email" placeholder="example@email.com" aria-describedby="email-error" required>
              <div id="email-error" class="invalid-feedback" role="alert"></div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="password">Пароль</label>
              <input class="form-control form-control-lg" id="password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="Мінімум 8 символів" aria-describedby="password-error" required>
              <div id="password-error" class="invalid-feedback" role="alert"></div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold" for="confirm-password">Підтвердження пароля</label>
              <input class="form-control form-control-lg" id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Повтори пароль" aria-describedby="confirm-error" required>
              <div id="confirm-error" class="invalid-feedback" role="alert"></div>
            </div>
            <div class="mb-4">
              <div class="form-check">
                <input class="form-check-input" id="agree-terms" type="checkbox" aria-describedby="terms-error" required>
                <label class="form-check-label" for="agree-terms">Погоджуюсь з умовами</label>
              </div>
              <div id="terms-error" class="field-error" role="alert"></div>
            </div>
            <button class="btn btn-submit btn-lg w-100" type="submit">Зареєструватися</button>
            <div id="success-message" class="success-message d-none mt-4" role="status" aria-live="polite">Реєстрація успішна!</div>
          </form>
        </section>
        <p class="footer-note text-center mt-4">Без сервера, бази даних та LocalStorage. Паролі не зберігаються.</p>
      </div>
    </div>
  </main>
</body>
</html>
